name: Build Android APK Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate Android Skeleton if needed
        run: |
          if [ ! -f "android/build.gradle" ]; then
            echo "Inicializando plataforma Android para compilación..."
            flutter create . --project-name data_abogados --platforms=android --org com.pget.trujillo
            # Restaurar obligatoriamente nuestro código fuente PGET y configuración
            git checkout HEAD -- lib/ pubspec.yaml
            git clean -fd lib/
          fi
          mkdir -p assets
          if [ ! -f "assets/credentials.json" ]; then
            echo '{"installed":{"client_id":"dummy"}}' > assets/credentials.json
          fi

          # Configurar Iconos Oficiales PGET y Gradle SDK 35 para el APK
          python3 -m pip install pillow
          python3 scripts/setup_android_icons.py

          echo "=== Verificación de App Oficial PGET ==="
          grep "PgetDataAbogadosApp" lib/main.dart

      - name: Install Dependencies
        run: |
          flutter pub get
          dart run flutter_launcher_icons || true

      - name: Build Android Release APK
        run: |
          if ! flutter build apk --release --no-tree-shake-icons > build_log.txt 2>&1; then
            echo "=== FLUTTER BUILD ERROR OUTPUT ==="
            tail -n 150 build_log.txt
            exit 1
          fi

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build_error_log.txt
          path: build_log.txt

      - name: Upload APK as Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PGET-Causas-Juridicas-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

