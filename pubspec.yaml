name: data_abogados
description: "Sistema Móvil de Gestión de Causas Jurídicas - Procuraduría General del Estado Trujillo"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  gsheets: ^0.5.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  provider: ^6.1.2
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/credentials.json
    - assets/logo_pget.png
    - assets/palacio_gobierno.jpg
