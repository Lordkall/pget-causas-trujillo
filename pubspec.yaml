name: data_abogados
description: "Sistema Móvil de Gestión de Causas Jurídicas - Procuraduría General del Estado Trujillo"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  gsheets: ^0.5.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  provider: ^6.1.2
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/circular_logo_pget.png"
  min_sdk_android: 21
  adaptive_icon_background: "#6B1226"
  adaptive_icon_foreground: "assets/circular_logo_pget.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo_pget.png
    - assets/circular_logo_pget.png
    - assets/palacio_gobierno.jpg
    - assets/pget_sa.enc
    - assets/compact_causes_by_tab.json
    - assets/pget_all_rows.json
